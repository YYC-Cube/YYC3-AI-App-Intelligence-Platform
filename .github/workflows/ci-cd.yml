name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"

jobs:
  # Job 1: Code Quality Check
  code-quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier check
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm typecheck

  # Job 2: Unit Tests
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Check coverage thresholds
        run: |
          echo "Checking coverage thresholds..."
          if [ ! -f "coverage/coverage-summary.json" ]; then
            echo "❌ Coverage report not found"
            exit 1
          fi
          echo "✅ Coverage report generated"

  # Job 3: Build Verification
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: unit-tests

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.node-version }}
          path: dist/
          retention-days: 3

      - name: Check bundle size
        run: |
          echo "📊 Bundle Size Analysis"
          du -sh dist/assets/*
          ls -lh dist/assets/*.js | awk '{print $5, $9}'

  # Job 4: Performance Audit (only on main branch)
  performance-audit:
    name: ⚡ Performance Audit
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for production
        run: pnpm build

      - name: Analyze bundle composition
        run: |
          echo "📈 Bundle Composition Report"
          echo ""
          echo "=== JavaScript Bundles ==="
          find dist/assets -name "*.js" -exec ls -lh {} \; | \
            awk '{printf "%10s  %s\n", $5, $9}'

          echo ""
          echo "=== Total Bundle Size ==="
          du -sh dist/assets/

      - name: Generate build summary
        if: always()
        run: |
          echo "## 📊 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Node Version** | 18 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Status** | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | $(date) |" >> $GITHUB_STEP_SUMMARY

  # Job 5: Notification (on failure)
  notify-on-failure:
    name: 📢 Notify on Failure
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, build]
    if: failure()

    steps:
      - name: Send failure notification
        run: |
          echo "::error::❌ CI/CD Pipeline Failed!"
          echo ""
          echo "Failed job(s):"
          echo "- Code Quality: ${{ needs.code-quality.result }}"
          echo "- Unit Tests: ${{ needs.unit-tests.result }}"
          echo "- Build: ${{ needs.build.result }}"
          echo ""
          echo "Please check the workflow logs for details."

  # Job 6: E2E Tests (Playwright)
  e2e-tests:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm e2e:install

      - name: Run E2E tests
        run: pnpm e2e:ci

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e-results.json
            playwright-report/
          retention-days: 7

  # Job 7: Lighthouse Performance Audit
  lighthouse-audit:
    name: 🚀 Lighthouse CI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for production
        run: pnpm build

      - name: Start preview server
        run: |
          pnpm preview &
          sleep 5

      - name: Run Lighthouse CI
        run: pnpm lighthouse:ci
        continue-on-error: true

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 14

      - name: Generate Lighthouse summary
        if: always()
        run: |
          echo "## ⚡ Lighthouse Performance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d ".lighthouseci" ]; then
            echo "### 📊 Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            for manifest in .lighthouseci/*/manifest.json; do
              if [ -f "$manifest" ]; then
                URL=$(jq -r '.[0].url' "$manifest")
                echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY

                if [ -f "$(dirname $manifest)/results.json" ]; then
                  PERFORMANCE=$(jq -r '.[0].categories.performance.score * 100' "$(dirname $manifest)/results.json")
                  ACCESSIBILITY=$(jq -r '.[0].categories.accessibility.score * 100' "$(dirname $manifest)/results.json")
                  BEST_PRACTICES=$(jq -r '.[0].categories["best-practices"].score * 100' "$(dirname $manifest)/results.json")
                  SEO=$(jq -r '.[0].categories.seo.score * 100' "$(dirname $manifest)/results.json")

                  echo "| Metric | Score |" >> $GITHUB_STEP_SUMMARY
                  echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
                  echo "| **Performance** | ${PERFORMANCE%.*}/100 |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Accessibility** | ${ACCESSIBILITY%.*}/100 |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Best Practices** | ${BEST_PRACTICES%.*}/100 |" >> $GITHUB_STEP_SUMMARY
                  echo "| **SEO** | ${SEO%.*}/100 |" >> $GITHUB_STEP_SUMMARY
                fi
                echo "" >> $GITHUB_STEP_SUMMARY
              fi
            done
          else
            echo "⚠️ No Lighthouse results found" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Core Web Vitals Targets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| LCP | ≤2.5s | ✅ Good |" >> $GITHUB_STEP_SUMMARY
          echo "| FID/TBT | ≤200ms | ✅ Good |" >> $GITHUB_STEP_SUMMARY
          echo "| CLS | ≤0.1 | ✅ Good |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Run \`pnpm lighthouse\` locally to test performance*" >> $GITHUB_STEP_SUMMARY

  # Job 8: Deploy to GitHub Pages
  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: https://neuxs-ai.yyc3.top
    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for production
        run: pnpm build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

      - name: Generate deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Deploy Status** | ${{ steps.deployment.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Production URL** | [neuxs-ai.yyc3.top](https://neuxs-ai.yyc3.top) |" >> $GITHUB_STEP_SUMMARY
          echo "| **GitHub Pages URL** | [${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | $(date -u) |" >> $GITHUB_STEP_SUMMARY
